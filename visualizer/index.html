<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic Engine Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            pointer-events: none;
        }
        .stats {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #fff; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">
            <h1>Neuromorphic Engine - Live</h1>
            <div id="status">Connecting...</div>
            <div id="tick">Tick: 0</div>
            <div id="neurons">Neurons: 0</div>
            <div id="synapses">Synapses: 0</div>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const tickEl = document.getElementById('tick');
        const neuronsEl = document.getElementById('neurons');
        const synapsesEl = document.getElementById('synapses');

        let width, height;
        let neuronsData = [];
        let synapsesData = [];
        let latestTick = 0;
        const visualState = new Map(); 

        const MAX_COORD = 65535;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        function connect() {
            const host = window.location.hostname || '127.0.0.1';
            const ws = new WebSocket('ws://' + host + ':3030/stream');

            ws.onopen = () => {
                statusEl.innerText = "Status: CONNECTED (Streaming)";
                statusEl.style.color = "#0f0";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                latestTick = data.tick;
                const neuronsData = data.neurons; // [id, x, y, visual_state]
                synapsesData = data.synapses; // [source, target, weight]
                
                for (let i = 0; i < neuronsData.length; i++) {
                    const [id, x, y, state] = neuronsData[i];
                    const sx = (x / MAX_COORD) * width;
                    const sy = (y / MAX_COORD) * height;
                    
                    let node = visualState.get(id) || { sx, sy, spikeGlow: 0.0, isRed: false };
                    node.sx = sx; node.sy = sy;
                    
                    if (state === 1) {
                        node.spikeGlow = 1.0; // Вспышка на максимум!
                    }
                    node.isRed = (state === 2); // Красный, если голодает
                    
                    visualState.set(id, node);
                }

                tickEl.innerText = `Tick: ${latestTick}`;
                neuronsEl.innerText = `Neurons: ${visualState.size}`;
                synapsesEl.innerText = `Synapses: ${synapsesData.length}`;
            };

            ws.onclose = () => {
                statusEl.innerText = "Status: DISCONNECTED (Retrying...)";
                statusEl.style.color = "#f00";
                setTimeout(connect, 1000);
            };

            ws.onerror = (err) => {
                console.error("WS Error:", err);
            };
        }

        connect();

        function draw() {
            requestAnimationFrame(draw);

            // Trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            if (visualState.size === 0) return;

            // Draw Synapses
            ctx.lineWidth = 1;
            for (let i = 0; i < synapsesData.length; i++) {
                const [source_id, target_id, weight] = synapsesData[i];
                const source = visualState.get(source_id);
                const target = visualState.get(target_id);

                if (source && target) {
                    ctx.beginPath();
                    ctx.moveTo(source.sx, source.sy);
                    ctx.lineTo(target.sx, target.sy);
                    
                    const alpha = Math.min(1.0, weight / 30.0);
                    ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
                    ctx.stroke();
                }
            }

            // Draw Neurons
            for (const [id, node] of visualState.entries()) {
                ctx.beginPath();
                
                // Плавное затухание спайка каждый кадр
                node.spikeGlow *= 0.90; 

                let radius = 2 + (node.spikeGlow * 2); // Нейрон "пульсирует" в размере от 2 до 4
                
                if (node.isRed) {
                    ctx.fillStyle = `rgba(255, 50, 50, 0.8)`; // Красный
                } else {
                    // Смешиваем Желтый (спайк) и Циан (покой)
                    // Чем меньше spikeGlow, тем ближе цвет к #00ffff
                    let r = Math.floor(node.spikeGlow * 255);
                    let g = 255;
                    let b = Math.floor((1.0 - node.spikeGlow) * 255);
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`; 
                }

                ctx.arc(node.sx, node.sy, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        requestAnimationFrame(draw);
    </script>
</body>
</html>
