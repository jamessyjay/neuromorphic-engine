<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic Engine Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 20, 0, 0.8);
            padding: 10px;
            border: 1px solid #0f0;
            pointer-events: none;
            font-size: 12px;
            text-transform: uppercase;
        }
        .label { font-weight: bold; color: #5f5; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="label">ENGINE:</span> NEUROMORPHIC v0.3.7</div>
        <div id="status">Status: CONNECTING...</div>
        <div id="tick">Tick: 0</div>
        <div id="neurons">Neurons: 0</div>
        <div id="synapses">Synapses: 0</div>
        <div style="margin-top: 5px; color: #aaa;">[LMB] ROTATE | [RMB] PAN | [WHEEL] ZOOM</div>
        <div id="log-container" style="margin-top: 10px; max-height: 150px; overflow-y: auto; border-top: 1px solid #0f0; padding-top: 5px; font-size: 10px;">
            <div style="color: #aaa; margin-bottom: 2px;">-- DEBUG LOGS --</div>
            <div id="logs"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Global error handler for debugging
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const status = document.getElementById('status');
            if (status) {
                status.innerText = "JS ERROR: " + msg;
                status.style.color = "#f0f";
            }
            logMsg("ERROR: " + msg);
            return false;
        };

        function logMsg(msg) {
            const logs = document.getElementById('logs');
            if (!logs) return;
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.appendChild(div);
            // Keep only last 20 logs
            while (logs.children.length > 20) {
                logs.removeChild(logs.firstChild);
            }
            document.getElementById('log-container').scrollTop = document.getElementById('log-container').scrollHeight;
        }

        // --- Configuration & Constants ---
        const MAX_COORD = 65535;
        const NEURON_RADIUS = 20; 
        const WORLD_SIZE = 4000;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(WORLD_SIZE * 1.5, WORLD_SIZE, WORLD_SIZE * 1.5);
        controls.update();

        // --- Objects ---
        const neuronMeshes = new Map(); // type -> InstancedMesh
        let synapseLines;
        let synapsePositions;
        let synapseColors;
        
        const neuronMap = new Map(); // id -> {x, y, z, type, typeIndex}
        let totalNeurons = 0;

        // Temporary objects to avoid allocation
        const _tempColor = new THREE.Color();
        const _tempMatrix = new THREE.Matrix4();
        const _tempPos = new THREE.Vector3();

        function getGeometryForType(type) {
            switch(type) {
                case 5: return new THREE.TetrahedronBufferGeometry(30); // Sensors
                case 4: return new THREE.OctahedronBufferGeometry(30);  // Motors
                case 3: return new THREE.BoxBufferGeometry(40, 40, 40); // Timers
                default: return new THREE.SphereBufferGeometry(20, 12, 12); // Others
            }
        }

        function initNetwork(data) {
            totalNeurons = data.total_neurons;
            
            // Clear existing meshes
            neuronMeshes.forEach(mesh => scene.remove(mesh));
            neuronMeshes.clear();

            // Count neurons per type
            const counts = {};
            data.neurons.forEach(n => {
                const type = n[7];
                counts[type] = (counts[type] || 0) + 1;
            });

            // Create InstancedMeshes for each type present
            for (const type in counts) {
                const geometry = getGeometryForType(parseInt(type));
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff
                });
                // In Three.js r128, to use instance colors with MeshBasicMaterial without getting black,
                // we sometimes need vertexColors to be true on the material AND provide colors.
                // However, an easier approach in r128 is using MeshPhongMaterial which handles instanceColor well natively.
                const betterMaterial = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    emissive: 0x000000,
                    flatShading: true
                });
                
                const mesh = new THREE.InstancedMesh(geometry, betterMaterial, counts[type]);
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                
                const colors = new Float32Array(counts[type] * 3);
                for(let i=0; i<colors.length; i++) colors[i] = 1;
                mesh.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
                
                scene.add(mesh);
                neuronMeshes.set(parseInt(type), {
                    mesh: mesh,
                    count: counts[type],
                    index: 0
                });
            }

            // Bring back some light for PhongMaterial
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Synapses: BufferGeometry with LineSegments
            if (synapseLines) scene.remove(synapseLines);
            const synGeometry = new THREE.BufferGeometry();
            synapseLines = new THREE.LineSegments(
                synGeometry,
                new THREE.LineBasicMaterial({ 
                    vertexColors: true, 
                    transparent: true, 
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            scene.add(synapseLines);
        }

        function updateSynapseGeometry(count) {
            if (!synapsePositions || synapsePositions.length < count * 6) {
                synapsePositions = new Float32Array(count * 6);
                synapseColors = new Float32Array(count * 6);
                synapseLines.geometry.setAttribute('position', new THREE.BufferAttribute(synapsePositions, 3));
                synapseLines.geometry.setAttribute('color', new THREE.BufferAttribute(synapseColors, 3));
            }
        }

        // --- WebSocket ---
        function getBaseColorForType(type) {
            switch(type) {
                // Spec 13 overrides
                case 0: return new THREE.Color(0x0088ff); // Pyramidal - Dim Blue (Resting)
                case 1: return new THREE.Color(0x0088ff); // Bipolar - Dim Blue
                case 2: return new THREE.Color(0x0088ff); // Interneuron - Dim Blue
                case 3: return new THREE.Color(0x0088ff); // Pacemaker - Dim Blue
                case 4: return new THREE.Color(0x0088ff); // Purkinje - Dim Blue
                case 5: return new THREE.Color(0x00ffff); // Photoreceptor - Cyan
                case 6: return new THREE.Color(0x00ffff); // Nociceptor - Cyan
                default: return new THREE.Color(0x0088ff);
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.hostname || '127.0.0.1';
            const port = window.location.port || '3030';
            const wsUrl = `${protocol}//${host}:${port}/stream`;
            
            console.log("Connecting to WebSocket:", wsUrl);
            logMsg(`Connecting to ${wsUrl}...`);
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status').innerText = "Status: ONLINE (3D)";
                document.getElementById('status').style.color = "#0f0";
                logMsg("WebSocket ONLINE.");
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Status: DISCONNECTED";
                document.getElementById('status').style.color = "#f00";
                logMsg("WebSocket DISCONNECTED. Reconnecting in 2s...");
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                logMsg("WebSocket ERROR occurred.");
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.type === "InitialState") {
                    const data = msg.payload;
                    totalNeurons = data.total_neurons;
                    logMsg(`Received InitialState: ${data.total_neurons} neurons, ${data.total_synapses} synapses.`);

                    // Clear existing meshes
                    neuronMeshes.forEach(mesh => scene.remove(mesh));
                    neuronMeshes.clear();

                    // Count neurons per type
                    const counts = {};
                    data.neurons.forEach(n => {
                        const type = n[4]; // n is [id, x, y, z, type]
                        counts[type] = (counts[type] || 0) + 1;
                    });

                    // Create InstancedMeshes
                    for (const type in counts) {
                        const geometry = getGeometryForType(parseInt(type));
                        const betterMaterial = new THREE.MeshPhongMaterial({
                            color: 0xffffff,
                            emissive: 0x000000,
                            flatShading: true
                        });
                        
                        const mesh = new THREE.InstancedMesh(geometry, betterMaterial, counts[type]);
                        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                        
                        const colors = new Float32Array(counts[type] * 3);
                        for(let i=0; i<colors.length; i++) colors[i] = 1;
                        mesh.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
                        
                        scene.add(mesh);
                        neuronMeshes.set(parseInt(type), {
                            mesh: mesh,
                            count: counts[type],
                            index: 0
                        });
                    }

                    // Synapses geometry init
                    const synCount = data.synapses.length;
                    if (synapseLines) scene.remove(synapseLines);
                    const synGeometry = new THREE.BufferGeometry();
                    synapseLines = new THREE.LineSegments(
                        synGeometry,
                        new THREE.LineBasicMaterial({ 
                            vertexColors: true, 
                            transparent: true, 
                            opacity: 0.6,
                            blending: THREE.AdditiveBlending
                        })
                    );
                    scene.add(synapseLines);
                    synapsePositions = new Float32Array(synCount * 6);
                    synapseColors = new Float32Array(synCount * 6);
                    synGeometry.setAttribute('position', new THREE.BufferAttribute(synapsePositions, 3));
                    synGeometry.setAttribute('color', new THREE.BufferAttribute(synapseColors, 3));

                    // Set static positions for neurons
                    neuronMeshes.forEach(m => m.index = 0);
                    for (let i = 0; i < data.neurons.length; i++) {
                        const [id, x, y, z, type] = data.neurons[i];
                        const meshData = neuronMeshes.get(type);
                        if (!meshData) continue;

                        const nx = (x / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                        const ny = (y / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                        const nz = (z / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);

                        _tempPos.set(nx, ny, nz);
                        _tempMatrix.setPosition(_tempPos);
                        
                        const idx = meshData.index;
                        meshData.mesh.setMatrixAt(idx, _tempMatrix);
                        neuronMap.set(id, { x: nx, y: ny, z: nz, type: type, meshIdx: idx });
                        meshData.index++;
                    }
                    neuronMeshes.forEach(m => {
                        m.mesh.instanceMatrix.needsUpdate = true;
                    });

                    // Set static synapse lines
                    for (let i = 0; i < synCount; i++) {
                        const [srcId, dstId, weight] = data.synapses[i];
                        const src = neuronMap.get(srcId);
                        const dst = neuronMap.get(dstId);

                        if (src && dst) {
                            const idx = i * 6;
                            synapsePositions[idx] = src.x;
                            synapsePositions[idx+1] = src.y;
                            synapsePositions[idx+2] = src.z;
                            synapsePositions[idx+3] = dst.x;
                            synapsePositions[idx+4] = dst.y;
                            synapsePositions[idx+5] = dst.z;
                            
                            const baseBrightness = Math.min(1.0, weight / 10.0 + 0.1);
                            _tempColor.setRGB(0.05 * baseBrightness, 0.2 * baseBrightness, 0.5 * baseBrightness);
                            synapseColors[idx] = _tempColor.r;
                            synapseColors[idx+1] = _tempColor.g;
                            synapseColors[idx+2] = _tempColor.b;
                            synapseColors[idx+3] = _tempColor.r;
                            synapseColors[idx+4] = _tempColor.g;
                            synapseColors[idx+5] = _tempColor.b;
                        }
                    }
                    if (synapseLines && synapseLines.geometry && synapseLines.geometry.attributes) {
                        if (synapseLines.geometry.attributes.position) synapseLines.geometry.attributes.position.needsUpdate = true;
                        if (synapseLines.geometry.attributes.color) synapseLines.geometry.attributes.color.needsUpdate = true;
                        synapseLines.geometry.setDrawRange(0, synCount * 2);
                    }
                    
                    document.getElementById('neurons').innerText = `Neurons: ${data.total_neurons}`;
                    document.getElementById('synapses').innerText = `Synapses: ${data.total_synapses}`;
                }
                
                else if (msg.type === "TickUpdate") {
                    const data = msg.payload;
                    
                    for (let i = 0; i < data.neurons.length; i++) {
                        const [id, state, atp_pct] = data.neurons[i];
                        const nData = neuronMap.get(id);
                        if (!nData) continue;
                        
                        const meshData = neuronMeshes.get(nData.type);
                        if (!meshData) continue;
                        
                        const baseColor = getBaseColorForType(nData.type);
                        if (state === 1.0) {
                            _tempColor.setRGB(1.0, 1.0, 0.8);
                        } else if (state === 2.0) {
                            _tempColor.setRGB(1.0, 0.0, 0.0);
                        } else {
                            _tempColor.copy(baseColor).multiplyScalar(0.5);
                        }
                        meshData.mesh.setColorAt(nData.meshIdx, _tempColor);
                    }

                    neuronMeshes.forEach(m => {
                        if (m.mesh.instanceColor) m.mesh.instanceColor.needsUpdate = true;
                    });

                    document.getElementById('tick').innerText = `Tick: ${data.tick}`;
                    // Optional: Show spikes in UI if needed: `Spikes: ${data.total_spikes}`
                }
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Status: OFFLINE (Retrying)";
                document.getElementById('status').style.color = "#f00";
                setTimeout(connect, 1000);
            };
        }

        connect();

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
