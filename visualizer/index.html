<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic Engine Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 20, 0, 0.8);
            padding: 10px;
            border: 1px solid #0f0;
            pointer-events: none;
            font-size: 12px;
            text-transform: uppercase;
        }
        .label { font-weight: bold; color: #5f5; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="label">ENGINE:</span> NEUROMORPHIC v0.3.7</div>
        <div id="status">Status: CONNECTING...</div>
        <div id="tick">Tick: 0</div>
        <div id="neurons">Neurons: 0</div>
        <div id="synapses">Synapses: 0</div>
        <div style="margin-top: 5px; color: #aaa;">[LMB] ROTATE | [RMB] PAN | [WHEEL] ZOOM</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Configuration & Constants ---
        const MAX_COORD = 65535;
        const NEURON_RADIUS = 150; 
        const WORLD_SIZE = 2000;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 50000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(WORLD_SIZE * 1.5, WORLD_SIZE, WORLD_SIZE * 1.5);
        controls.update();

        // --- Objects ---
        let neuronMesh;
        let synapseLines;
        let synapsePositions;
        let synapseColors;
        
        const neuronMap = new Map(); // id -> index in InstancedMesh
        let totalNeurons = 0;

        // Temporary objects to avoid allocation
        const _tempColor = new THREE.Color();
        const _tempMatrix = new THREE.Matrix4();
        const _tempPos = new THREE.Vector3();

        function initNetwork(neuronCount) {
            totalNeurons = neuronCount;
            
            // Neurons: InstancedMesh for performance
            const geometry = new THREE.SphereGeometry(NEURON_RADIUS, 8, 8);
            const material = new THREE.MeshBasicMaterial();
            neuronMesh = new THREE.InstancedMesh(geometry, material, neuronCount);
            neuronMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            neuronMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(neuronCount * 3), 3);
            scene.add(neuronMesh);

            // Synapses: BufferGeometry with LineSegments
            const synGeometry = new THREE.BufferGeometry();
            // We pre-allocate for a large number of synapses or update dynamically
            // For now, we'll initialize empty and update on first big data burst
            synapseLines = new THREE.LineSegments(
                synGeometry,
                new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.6 })
            );
            scene.add(synapseLines);
        }

        function updateSynapseGeometry(count) {
            if (!synapsePositions || synapsePositions.length < count * 6) {
                synapsePositions = new Float32Array(count * 6);
                synapseColors = new Float32Array(count * 6);
                synapseLines.geometry.setAttribute('position', new THREE.BufferAttribute(synapsePositions, 3));
                synapseLines.geometry.setAttribute('color', new THREE.BufferAttribute(synapseColors, 3));
            }
        }

        // --- WebSocket ---
        function connect() {
            const host = window.location.hostname || '127.0.0.1';
            const ws = new WebSocket('ws://' + host + ':3030/stream');

            ws.onopen = () => {
                document.getElementById('status').innerText = "Status: ONLINE (3D)";
                document.getElementById('status').style.color = "#0f0";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (!neuronMesh || data.total_neurons !== totalNeurons) {
                    if (neuronMesh) scene.remove(neuronMesh);
                    initNetwork(data.total_neurons);
                }

                // Update Neurons
                for (let i = 0; i < data.neurons.length; i++) {
                    const [id, x, y, z, voltage, threshold, atp_pct] = data.neurons[i];
                    
                    const nx = (x / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                    const ny = (y / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                    const nz = (z / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);

                    _tempPos.set(nx, ny, nz);
                    _tempMatrix.setPosition(_tempPos);
                    neuronMesh.setMatrixAt(i, _tempMatrix);
                    neuronMap.set(id, { x: nx, y: ny, z: nz });

                    // Color logic
                    if (voltage > threshold) {
                        _tempColor.setHex(0xffffff); // SPIKE!
                    } else if (atp_pct > 80) {
                        _tempColor.setHex(0x00ff00); // Healthy Green
                    } else if (atp_pct > 30) {
                        // Mix Green to Yellow
                        const factor = (atp_pct - 30) / 50;
                        _tempColor.setRGB(1 - factor, 1, 0); 
                    } else {
                        _tempColor.setHex(0xff3300); // Exhausted Red
                    }
                    neuronMesh.setColorAt(i, _tempColor);
                }
                neuronMesh.instanceMatrix.needsUpdate = true;
                if (neuronMesh.instanceColor) neuronMesh.instanceColor.needsUpdate = true;

                // Update Synapses
                const synCount = data.synapses.length;
                updateSynapseGeometry(synCount);

                for (let i = 0; i < synCount; i++) {
                    const [srcId, dstId, weight] = data.synapses[i];
                    const src = neuronMap.get(srcId);
                    const dst = neuronMap.get(dstId);

                    if (src && dst) {
                        const idx = i * 6;
                        synapsePositions[idx] = src.x;
                        synapsePositions[idx+1] = src.y;
                        synapsePositions[idx+2] = src.z;
                        synapsePositions[idx+3] = dst.x;
                        synapsePositions[idx+4] = dst.y;
                        synapsePositions[idx+5] = dst.z;

                        // Synapse Color based on weight/activity
                        const alpha = Math.min(0.8, weight / 10.0 + 0.1);
                        _tempColor.setRGB(0.4, 0.7, 1.0).multiplyScalar(alpha);
                        
                        synapseColors[idx] = _tempColor.r;
                        synapseColors[idx+1] = _tempColor.g;
                        synapseColors[idx+2] = _tempColor.b;
                        synapseColors[idx+3] = _tempColor.r;
                        synapseColors[idx+4] = _tempColor.g;
                        synapseColors[idx+5] = _tempColor.b;
                    }
                }
                synapseLines.geometry.attributes.position.needsUpdate = true;
                synapseLines.geometry.attributes.color.needsUpdate = true;
                synapseLines.geometry.setDrawRange(0, synCount * 2);

                document.getElementById('tick').innerText = `Tick: ${data.tick}`;
                document.getElementById('neurons').innerText = `Neurons: ${data.total_neurons}`;
                document.getElementById('synapses').innerText = `Synapses: ${data.total_synapses}`;
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Status: OFFLINE (Retrying)";
                document.getElementById('status').style.color = "#f00";
                setTimeout(connect, 1000);
            };
        }

        connect();

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
