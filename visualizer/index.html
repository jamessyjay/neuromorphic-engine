<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic Engine Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #4ade80;
            background: rgba(0, 20, 0, 0.8);
            padding: 10px;
            border: 1px solid #4ade80;
            pointer-events: none;
            font-size: 12px;
            text-transform: uppercase;
        }
        .label { font-weight: bold; color: #86efac; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="label">ENGINE:</span> NEUROMORPHIC v0.3.7</div>
        <div id="status">Status: CONNECTING...</div>
        <div id="tick">Tick: 0</div>
        <div id="neurons">Neurons: 0</div>
        <div id="synapses">Synapses: 0</div>
        <div style="margin-top: 5px; color: #aaa;">[LMB] ROTATE | [RMB] PAN | [WHEEL] ZOOM</div>
        <div id="log-container" style="margin-top: 10px; max-height: 150px; overflow-y: auto; border-top: 1px solid #86dba5; padding-top: 5px; font-size: 10px;">
            <div style="color: #aaa; margin-bottom: 2px;">-- DEBUG LOGS --</div>
            <div id="logs"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Глобальные переменные и WebSocket ---
        let ws;
        const nodeMap = new Map();
        let neuronMeshes = [];
        let synapseLines, pulseSystem;
        const activePulses = [];

        // Цветовая палитра по типам
        const TYPE_COLORS = {
            0: new THREE.Color(0x00aaff), // Pyramidal - Голубой
            1: new THREE.Color(0x44ff44), // Bipolar - Зеленый
            2: new THREE.Color(0xffaa00), // Interneuron - Оранжевый
            3: new THREE.Color(0xff00ff), // Pacemaker - Маджента
            4: new THREE.Color(0xff4444), // Purkinje - Красный
            5: new THREE.Color(0xffff00), // Photoreceptor - Золотой
            6: new THREE.Color(0x00ffff), // Nociceptor - Циан
            dead: new THREE.Color(0x220000) // Тёмно-красный (труп)
        };

        const MAX_PULSES = 3000;      
        const PULSE_SPEED = 0.015;     
        const VISUAL_SAMPLING = 0.3;   
        const pulsePositions = new Float32Array(MAX_PULSES * 3);
        const pulseGeometry = new THREE.BufferGeometry();
        pulseGeometry.setAttribute('position', new THREE.BufferAttribute(pulsePositions, 3));
        pulseGeometry.attributes.position.setUsage(THREE.DynamicDrawUsage);

        const _tempColor = new THREE.Color();
        const _dummy = new THREE.Object3D();

        function logMsg(msg) {
            const logs = document.getElementById('logs');
            if (!logs) return;
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logs.prepend(div);
            while (logs.children.length > 20) logs.removeChild(logs.lastChild);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 0, 200);
        controls.enableDamping = true;

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const glowTexture = createGlowTexture();

        function initNetwork(data) {
            neuronMeshes.forEach(m => {
                scene.remove(m.mesh);
                m.mesh.geometry.dispose();
                m.mesh.material.dispose();
            });
            neuronMeshes = [];
            if (synapseLines) {
                scene.remove(synapseLines);
                synapseLines.geometry.dispose();
                synapseLines.material.dispose();
            }
            if (pulseSystem) scene.remove(pulseSystem);
            
            nodeMap.clear();
            activePulses.length = 0;

            const counts = {};
            data.neurons.forEach(n => {
                const type = n[4];
                counts[type] = (counts[type] || 0) + 1;
            });

            const geometries = {
                5: new THREE.TetrahedronGeometry(2),
                4: new THREE.OctahedronGeometry(2),
                3: new THREE.BoxGeometry(3, 3, 3),
                default: new THREE.SphereGeometry(1.5, 8, 8)
            };

            Object.keys(counts).forEach(typeStr => {
                const type = parseInt(typeStr);
                const mesh = new THREE.InstancedMesh(
                    geometries[type] || geometries.default, 
                    new THREE.MeshBasicMaterial({ color: 0xffffff }), 
                    counts[type]
                );
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                scene.add(mesh);
                neuronMeshes.push({ type, mesh, currentIndex: 0 });
            });

            data.neurons.forEach(n => {
                const id = n[0], type = n[4];
                const SPACE = 100.0, HALF = 50.0;
                let x = (n[1] / 65535.0) * SPACE - HALF;
                let y = (n[2] / 65535.0) * SPACE - HALF;
                let z = (n[3] / 65535.0) * SPACE - HALF;

                if (type === 5) x = -75.0; 
                else if (type === 4) x = 75.0;
                else if (type === 0 || type === 3) x = -10.0 + (Math.random() * 20 - 10);

                const meshData = neuronMeshes.find(m => m.type === type);
                if (meshData) {
                    _dummy.position.set(x, y, z);
                    _dummy.updateMatrix();
                    meshData.mesh.setMatrixAt(meshData.currentIndex, _dummy.matrix);
                    
                    const baseColor = TYPE_COLORS[type] || TYPE_COLORS[0];
                    meshData.mesh.setColorAt(meshData.currentIndex, baseColor);
                    
                    nodeMap.set(id, { 
                        x, y, z, type, 
                        meshIdx: meshData.currentIndex, 
                        outgoing: [],
                        visualActivity: 0,
                        isAlive: true 
                    });
                    meshData.currentIndex++;
                }
            });
            neuronMeshes.forEach(m => m.mesh.instanceMatrix.needsUpdate = true);

            if (data.synapses && data.synapses.length > 0) {
                const pos = new Float32Array(data.synapses.length * 6);
                const col = new Float32Array(data.synapses.length * 6);
                
                data.synapses.forEach((syn, i) => {
                    const src = nodeMap.get(syn[0]), tgt = nodeMap.get(syn[1]);
                    const weight = syn[2] || 1.0;
                    if (src && tgt) {
                        const idx = i * 6;
                        pos[idx] = src.x; pos[idx+1] = src.y; pos[idx+2] = src.z;
                        pos[idx+3] = tgt.x; pos[idx+4] = tgt.y; pos[idx+5] = tgt.z;
                        
                        const intensity = Math.min(weight / 5.0, 1.0);
                        _tempColor.setHSL(0.55, 0.8, 0.1 + intensity * 0.4);
                        col[idx] = col[idx+3] = _tempColor.r;
                        col[idx+1] = col[idx+4] = _tempColor.g;
                        col[idx+2] = col[idx+5] = _tempColor.b;
                        
                        src.outgoing.push({ targetId: syn[1], weight: weight });
                    }
                });

                const lineGeo = new THREE.BufferGeometry();
                lineGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                lineGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                synapseLines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ 
                    vertexColors: true, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending 
                }));
                scene.add(synapseLines);

                pulseSystem = new THREE.Points(pulseGeometry, new THREE.PointsMaterial({
                    color: 0xccffef, size: 0.8, map: glowTexture, transparent: true, opacity: 0.9,
                    blending: THREE.AdditiveBlending, depthWrite: false
                }));
                pulseSystem.frustumCulled = false;
                scene.add(pulseSystem);
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || '127.0.0.1';
            ws = new WebSocket(`${protocol}//${host}/stream`);

            ws.onopen = () => { 
                logMsg("WebSocket Connected."); 
                document.getElementById('status').innerText = "Status: ONLINE (STDP-READY)";
                document.getElementById('status').style.color = "#4ade80";
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'InitialState') {
                    initNetwork(msg.payload);
                } else if (msg.type === 'TickUpdate') {
                    const data = msg.payload;
                    data.neurons.forEach(n => {
                        const id = n[0], state = n[1], atp = n[2];
                        const nData = nodeMap.get(id);
                        if (nData) {
                            if (atp <= 0) nData.isAlive = false;

                            if (state === 2.0 && nData.isAlive) { 
                                nData.visualActivity = 1.0; 
                                if (activePulses.length < MAX_PULSES) {
                                    nData.outgoing.forEach(syn => {
                                        if (Math.random() < VISUAL_SAMPLING && activePulses.length < MAX_PULSES) {
                                            const tgt = nodeMap.get(syn.targetId);
                                            if (tgt) activePulses.push({ s: nData, t: tgt, p: 0 });
                                        }
                                    });
                                }
                            }
                        }
                    });
                    document.getElementById('tick').innerText = `Tick: ${data.tick}`;
                }
            };
            ws.onclose = () => { setTimeout(connect, 2000); };
        }

        function animate() {
            requestAnimationFrame(animate);
    
            // Плавное остывание нейронов
            neuronMeshes.forEach(m => {
                nodeMap.forEach((nData) => {
                    const meshGroup = neuronMeshes.find(mesh => mesh.type === nData.type);
                    if (meshGroup && meshGroup.mesh === m.mesh) {
                        nData.visualActivity *= 0.94;
                        
                        if (!nData.isAlive) {
                            _tempColor.copy(TYPE_COLORS.dead);
                        } else {
                            const baseColor = TYPE_COLORS[nData.type] || TYPE_COLORS[0];
                            _tempColor.copy(baseColor).lerp(new THREE.Color(1,1,1), nData.visualActivity);
                        }
                        m.mesh.setColorAt(nData.meshIdx, _tempColor);
                    }
                });
                m.mesh.instanceColor.needsUpdate = true;
            });

            // Движение импульсов
            if (pulseSystem && activePulses.length > 0) {
                const positions = pulseSystem.geometry.attributes.position.array;
                for (let i = 0; i < MAX_PULSES; i++) {
                    const idx = i * 3;
                    if (i < activePulses.length) {
                        const pulse = activePulses[i];
                        pulse.p += PULSE_SPEED;
                        if (pulse.p >= 1.0) {
                            activePulses.splice(i, 1);
                            i--; continue;
                        }
                        positions[idx] = pulse.s.x + (pulse.t.x - pulse.s.x) * pulse.p;
                        positions[idx+1] = pulse.s.y + (pulse.t.y - pulse.s.y) * pulse.p;
                        positions[idx+2] = pulse.s.z + (pulse.t.z - pulse.s.z) * pulse.p;
                    } else {
                        positions[idx] = positions[idx+1] = positions[idx+2] = 10000;
                    }
                }
                pulseSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        connect();
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
