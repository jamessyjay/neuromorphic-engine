<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuromorphic Engine Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 20, 0, 0.8);
            padding: 10px;
            border: 1px solid #0f0;
            pointer-events: none;
            font-size: 12px;
            text-transform: uppercase;
        }
        .label { font-weight: bold; color: #5f5; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div><span class="label">ENGINE:</span> NEUROMORPHIC v0.3.7</div>
        <div id="status">Status: CONNECTING...</div>
        <div id="tick">Tick: 0</div>
        <div id="neurons">Neurons: 0</div>
        <div id="synapses">Synapses: 0</div>
        <div style="margin-top: 5px; color: #aaa;">[LMB] ROTATE | [RMB] PAN | [WHEEL] ZOOM</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Configuration & Constants ---
        const MAX_COORD = 65535;
        const NEURON_RADIUS = 20; 
        const WORLD_SIZE = 4000;

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(WORLD_SIZE * 1.5, WORLD_SIZE, WORLD_SIZE * 1.5);
        controls.update();

        // --- Objects ---
        const neuronMeshes = new Map(); // type -> InstancedMesh
        let synapseLines;
        let synapsePositions;
        let synapseColors;
        
        const neuronMap = new Map(); // id -> {x, y, z, type, typeIndex}
        let totalNeurons = 0;

        // Temporary objects to avoid allocation
        const _tempColor = new THREE.Color();
        const _tempMatrix = new THREE.Matrix4();
        const _tempPos = new THREE.Vector3();

        function getGeometryForType(type) {
            switch(type) {
                case 5: return new THREE.TetrahedronBufferGeometry(30); // Sensors
                case 4: return new THREE.OctahedronBufferGeometry(30);  // Motors
                case 3: return new THREE.BoxBufferGeometry(40, 40, 40); // Timers
                default: return new THREE.SphereBufferGeometry(20, 12, 12); // Others
            }
        }

        function initNetwork(data) {
            totalNeurons = data.total_neurons;
            
            // Clear existing meshes
            neuronMeshes.forEach(mesh => scene.remove(mesh));
            neuronMeshes.clear();

            // Count neurons per type
            const counts = {};
            data.neurons.forEach(n => {
                const type = n[7];
                counts[type] = (counts[type] || 0) + 1;
            });

            // Create InstancedMeshes for each type present
            for (const type in counts) {
                const geometry = getGeometryForType(parseInt(type));
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const mesh = new THREE.InstancedMesh(geometry, material, counts[type]);
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(counts[type] * 3), 3);
                scene.add(mesh);
                neuronMeshes.set(parseInt(type), {
                    mesh: mesh,
                    count: counts[type],
                    index: 0
                });
            }

            // Synapses: BufferGeometry with LineSegments
            if (synapseLines) scene.remove(synapseLines);
            const synGeometry = new THREE.BufferGeometry();
            synapseLines = new THREE.LineSegments(
                synGeometry,
                new THREE.LineBasicMaterial({ 
                    vertexColors: true, 
                    transparent: true, 
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            scene.add(synapseLines);
        }

        function updateSynapseGeometry(count) {
            if (!synapsePositions || synapsePositions.length < count * 6) {
                synapsePositions = new Float32Array(count * 6);
                synapseColors = new Float32Array(count * 6);
                synapseLines.geometry.setAttribute('position', new THREE.BufferAttribute(synapsePositions, 3));
                synapseLines.geometry.setAttribute('color', new THREE.BufferAttribute(synapseColors, 3));
            }
        }

        // --- WebSocket ---
        function connect() {
            const host = window.location.hostname || '127.0.0.1';
            const ws = new WebSocket('ws://' + host + ':3030/stream');

            ws.onopen = () => {
                document.getElementById('status').innerText = "Status: ONLINE (3D)";
                document.getElementById('status').style.color = "#0f0";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (neuronMeshes.size === 0 || data.total_neurons !== totalNeurons) {
                    initNetwork(data);
                }

                // Reset indices for this frame
                neuronMeshes.forEach(m => m.index = 0);

                // Update Neurons
                for (let i = 0; i < data.neurons.length; i++) {
                    const [id, x, y, z, voltage, threshold, atp_pct, type] = data.neurons[i];
                    const meshData = neuronMeshes.get(type);
                    if (!meshData) continue;

                    const nx = (x / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                    const ny = (y / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);
                    const nz = (z / MAX_COORD) * WORLD_SIZE - (WORLD_SIZE / 2);

                    _tempPos.set(nx, ny, nz);
                    _tempMatrix.setPosition(_tempPos);
                    
                    const idx = meshData.index;
                    meshData.mesh.setMatrixAt(idx, _tempMatrix);
                    neuronMap.set(id, { x: nx, y: ny, z: nz });

                    // Color logic (Highly Saturated & Normalized)
                    if (voltage > threshold) {
                        _tempColor.setRGB(1.0, 1.0, 1.0); // PURE WHITE SPIKE
                    } else if (atp_pct > 80) {
                        _tempColor.setRGB(0.0, 1.0, 0.0); // BRIGHT GREEN (Healthy)
                    } else if (atp_pct > 30) {
                        const factor = (atp_pct - 30) / 50;
                        _tempColor.setRGB(1.0, 1.0, 0.0).lerp(new THREE.Color(0, 1, 0), factor); 
                    } else {
                        _tempColor.setRGB(1.0, 0.0, 0.0); // PURE RED (Exhausted)
                    }
                    meshData.mesh.setColorAt(idx, _tempColor);
                    meshData.index++;
                }

                neuronMeshes.forEach(m => {
                    m.mesh.instanceMatrix.needsUpdate = true;
                    if (m.mesh.instanceColor) m.mesh.instanceColor.needsUpdate = true;
                });

                // Update Synapses
                const synCount = data.synapses.length;
                updateSynapseGeometry(synCount);

                for (let i = 0; i < synCount; i++) {
                    const [srcId, dstId, weight] = data.synapses[i];
                    const src = neuronMap.get(srcId);
                    const dst = neuronMap.get(dstId);

                    if (src && dst) {
                        const idx = i * 6;
                        synapsePositions[idx] = src.x;
                        synapsePositions[idx+1] = src.y;
                        synapsePositions[idx+2] = src.z;
                        synapsePositions[idx+3] = dst.x;
                        synapsePositions[idx+4] = dst.y;
                        synapsePositions[idx+5] = dst.z;

                        // Synapse Color based on weight/activity (Normalized)
                        const brightness = Math.min(1.0, weight / 5.0 + 0.3);
                        _tempColor.setRGB(0.1 * brightness, 0.5 * brightness, 1.0 * brightness); 
                        
                        synapseColors[idx] = _tempColor.r;
                        synapseColors[idx+1] = _tempColor.g;
                        synapseColors[idx+2] = _tempColor.b;
                        synapseColors[idx+3] = _tempColor.r;
                        synapseColors[idx+4] = _tempColor.g;
                        synapseColors[idx+5] = _tempColor.b;
                    }
                }
                synapseLines.geometry.attributes.position.needsUpdate = true;
                synapseLines.geometry.attributes.color.needsUpdate = true;
                synapseLines.geometry.setDrawRange(0, synCount * 2);

                document.getElementById('tick').innerText = `Tick: ${data.tick}`;
                document.getElementById('neurons').innerText = `Neurons: ${data.total_neurons}`;
                document.getElementById('synapses').innerText = `Synapses: ${data.total_synapses}`;
            };

            ws.onclose = () => {
                document.getElementById('status').innerText = "Status: OFFLINE (Retrying)";
                document.getElementById('status').style.color = "#f00";
                setTimeout(connect, 1000);
            };
        }

        connect();

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
