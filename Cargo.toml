[package]
name = "neuromorphic_engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = []

[dependencies]
bincode = "1.3"
futures-util = "0.3.32"
libc = "0.2"
plotters = "0.3.5"
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["full"] }
warp = "0.3"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.8.2"
serial_test = "3.4.0"

[lib]
name = "neuromorphic_engine"
path = "src/lib.rs"

[[bin]]
name = "neuromorphic-engine"
path = "src/main.rs"

[[bench]]
name = "graph_benches"
harness = false
