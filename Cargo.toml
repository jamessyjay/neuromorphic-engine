[package]
name = "neuromorphic-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3"
futures-util = "0.3.32"
libc = "0.2"
plotters = "0.3.5"
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
